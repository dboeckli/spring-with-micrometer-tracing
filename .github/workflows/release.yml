name: Maven Release

env:
  JAVA_VERSION: 25

on:
  workflow_dispatch:

jobs:
  
  check-branch:
    name: Check Branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for main
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [[ "$BRANCH" == "main" ||  "$BRANCH" == "master" ]];
          then
            echo "Releasing main branch, resuming"
          else
            echo "Releasing only allowed for branch 'main' or 'master'"
            exit 1
          fi
  
  check-maven-version:
    name: Check maven Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version
        run: |
          MAVEN_VERSION=$( mvn help:evaluate -Dexpression=project.version -q -DforceStdout )
          if [[ "$MAVEN_VERSION" == *SNAPSHOT ]];
          then
            echo "Maven version ends with SNAPSHOT"
          else
            echo "Maven version must be a SNAPSHOT version to release"
            exit 1
          fi
  
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ check-branch, check-maven-version ]
    permissions:
      contents: write
      packages: write
    steps:

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # requires admin gitHub token which can do merge on master
          token: ${{ secrets.RELEASE_TOKEN }} 
          fetch-depth: 0

      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: 3.14.1

      - name: Set up java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'liberica'
          cache: 'maven'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml.
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Show Helm version
        run: helm version --short

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: View settings.xml
        run: | 
          echo "### show settings.xml ###"
          cat ./settings.xml
      
      - name: Setup git user
        env:
          CI_USER_EMAIL: ${{ vars.CI_USER_EMAIL }}
          CI_USER: ${{ vars.CI_USER }}
        run: |
          # Check if required parameters are set
          required_params=("CI_USER_EMAIL" "CI_USER")
          for param in "${required_params[@]}"; do
            if [ -z "${!param}" ]; then
              echo "::error::Required parameter $param is not set"
              exit 1
            fi
          done
          git config --global user.email "${{ vars.CI_USER_EMAIL }}" 
          git config --global user.name "${{ vars.CI_USER }}"        

      - name: Release
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # requires admin gitHub token which can do merge on master
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          # Check if required parameters are set
          required_params=("GITHUB_ACTOR" "GITHUB_TOKEN" "DOCKER_USER" "DOCKER_TOKEN")
          for param in "${required_params[@]}"; do
          if [ -z "${!param}" ]; then
            echo "::error::Required parameter $param is not set"
            exit 1
          fi
          done
          mvn -B release:prepare release:perform -s $GITHUB_WORKSPACE/settings.xml
