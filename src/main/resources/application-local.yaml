server:
  port: 8080

spring:
  application:
    name: spring-with-micrometer-tracing
  docker:
    compose:
      enabled: true
      stop:
        command: down

management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      # WARNING: SECURITY RISK - DO NOT USE IN PRODUCTION ENVIRONMENT
      # This configuration exposes sensitive data and should only be used for development or testing purposes.
      # Ensure this is disabled in any environment where security is a concern.
      show-values: ALWAYS
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      access: unrestricted
    env:
      show-values: ALWAYS
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: full

  # --- OpenTelemetry / OTLP ---
  tracing:
    enabled: true   # enable tracing with OpenTelemetry
    propagation:
      type: w3c
      produce: w3c
      consume: w3c
    baggage:
      enabled: true
      # Specify which baggage fields should be propagated to downstream services
      correlation:
        # Also make baggage available in MDC for logging
        fields:
          - testBaggage
          - addedBaggageByFilter
          - addedBaggageByController
          - addedBaggageByService
        enabled: true
      # Erlaubt das Empfangen des Headers "baggage: testBaggage=..." der im http request gesetzt wird
      remote-fields:
        - testBaggage
      # KOPIERT den Wert aus dem Baggage in die Span-Labels (Attributes)
      tag-fields:
        - testBaggage
        - addedBaggageByFilter
        - addedBaggageByController
        - addedBaggageByService
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces  # Collector
      export:
        enabled: true  # Traces to Collector
    metrics:
      export:
        url: http://localhost:4318/v1/metrics     # Collector
        enabled: true  # Metrics to Collector
    logging:
      endpoint: http://localhost:4318/v1/logs     # Collector
      export:
        enabled: true  # Logs to Collector